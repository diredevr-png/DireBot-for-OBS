# Builds DireBot for OBS for Windows, and tests it - in a real OBS too
# (Linux, on a pretend screen). The Windows zip comes out as a download
# on the run's page. It isn't signed here: DireBot only installs a copy
# signed by DireBot's own publisher, so a release's zip is signed first
# (DireBot's tools/sign_obs_plugin.py) and then added to the release.
name: Build

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (inside a real OBS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The tall picture needs OBS 31.1 or newer (its canvas API), newer
      # than Ubuntu's own OBS - so OBS's own package, which has the headers
      # too (its headers need simde's).
      - name: Install OBS and the test tools
        run: |
          # (Launchpad now and then answers a server error for the PPA's
          # key: asked again a few times before giving up.)
          added=
          for try in 1 2 3 4 5; do
            if sudo add-apt-repository -y ppa:obsproject/obs-studio; then
              added=1
              break
            fi
            sleep $((try * 15))
          done
          [ -n "$added" ]
          sudo apt-get update
          sudo apt-get install -y obs-studio libsimde-dev xvfb g++
          grep -q obs_canvas_t /usr/include/obs/obs.h || {
            echo "This OBS has no canvas API (needs OBS 31.1 or newer):"
            dpkg -s obs-studio | grep '^Version'
            exit 1
          }
          # The one header the package leaves out (the source profiler's),
          # from OBS's own source for the version installed.
          version="$(dpkg-query -W -f='${Version}' obs-studio | sed 's/-.*//')"
          mkdir -p "$RUNNER_TEMP/obs-extra/util"
          [ -f /usr/include/obs/util/source-profiler.h ] ||
            curl -fsSL -o "$RUNNER_TEMP/obs-extra/util/source-profiler.h" \
              "https://raw.githubusercontent.com/obsproject/obs-studio/$version/libobs/util/source-profiler.h"
          python3 -m pip install --user --break-system-packages pytest obsws-python websocket-client
      - name: Link tests
        run: BUILD_DIR="$RUNNER_TEMP/link" tools/test-link.sh
      - name: Inside OBS
        run: |
          BUILD_DIR="$RUNNER_TEMP/linux" EXTRA_FLAGS="-I$RUNNER_TEMP/obs-extra" tools/build-linux-test.sh
          DIREBOT_OBS_PLUGIN="$RUNNER_TEMP/linux/direbot-for-obs.so" python3 -m pytest -q tests/test_real_obs.py tests/test_real_face.py tests/test_real_companions.py tests/test_real_hair.py

  windows:
    name: Build for Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: .github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo
      - name: Pack
        shell: pwsh
        run: .github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo
      - name: Fingerprint
        shell: pwsh
        run: |
          Get-ChildItem release/*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: direbot-for-obs-windows-x64-${{ github.sha }}
          path: |
            release/*.zip
            release/SHA256SUMS.txt

  windows-obs:
    name: Windows zip in real OBS ${{ matrix.obs }}
    needs: windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # The oldest OBS the add-on supports, the one before 33, and the
        # newest. OBS 33 took functions out of obs.dll that 0.8.1 linked
        # to, so Windows wouldn't load it: every OBS here is checked.
        include:
          - obs: 31.1.1
            layout: legacy
          - obs: 32.2.2
            layout: legacy
          - obs: 33.0.1
            layout: new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: direbot-for-obs-windows-x64-${{ github.sha }}
          path: release
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/obs-${{ matrix.obs }}
          key: obs-windows-${{ matrix.obs }}
      - name: Get OBS ${{ matrix.obs }}
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/obs-${{ matrix.obs }}"
          if (-not (Test-Path "$dir/bin/64bit/obs64.exe")) {
            $zip = "$env:RUNNER_TEMP/obs.zip"
            Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/${{ matrix.obs }}/OBS-Studio-${{ matrix.obs }}-Windows-x64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force
          }
          Get-ChildItem "$dir/bin/64bit/obs64.exe"
      - name: Every function the add-on calls is in this OBS
        shell: pwsh
        run: |
          $zip = (Get-ChildItem release/*.zip)[0].FullName
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP/addon" -Force
          python tools/check-obs-imports.py "$env:RUNNER_TEMP/addon/direbot-for-obs/bin/64bit/direbot-for-obs.dll" "$env:RUNNER_TEMP/obs-${{ matrix.obs }}/bin/64bit"
      - name: Inside OBS
        shell: pwsh
        env:
          DIREBOT_OBS_ROOT: ${{ runner.temp }}/obs-${{ matrix.obs }}
          DIREBOT_OBS_LAYOUT: ${{ matrix.layout }}
          DIREBOT_OBS_EXPECT: ${{ matrix.obs }}
          DIREBOT_OBS_REQUIRE: '1'
        run: |
          python -m pip install pytest obsws-python websocket-client
          $env:DIREBOT_OBS_ZIP = (Get-ChildItem release/*.zip)[0].FullName
          python -m pytest -v -s -rs tests/test_real_windows.py

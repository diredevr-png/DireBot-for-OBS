Description="Connects OBS to DireBot by itself, and shows what's slowing OBS down."

# Vertical
Vertical.Title="DireBot Vertical"
Vertical.Intro="Where your vertical (tall) picture streams to. Set up the picture and its scenes in DireBot (Studio → Vertical). Stream keys are typed here and stay in OBS: DireBot never sees them."

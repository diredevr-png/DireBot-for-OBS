Description="Connects OBS to DireBot by itself, and shows what's slowing OBS down."

# Vertical
Vertical.Title="DireBot Vertical"
Vertical.Intro="Where your vertical (tall) picture streams to. Set up the picture and its scenes in DireBot (Studio → Vertical). Stream keys are typed here and stay in OBS: DireBot never sees them."
Vertical.Place="Place %1 (tick to stream here)"
Vertical.Site="Site"
Vertical.Server="Server"
Vertical.Key="Stream key"
Vertical.KeyTip="Paste the stream key the site gives you. It's saved locked to this Windows account, and never shown again."
Vertical.KeySaved="A key is saved. Type a new one to replace it."
Vertical.KeyNone="No stream key yet."
Vertical.Stale="You switched to another OBS profile while this was open. Nothing here is saved now - close this window and open it again (Tools → DireBot Vertical) to change this profile's places."
Vertical.KeyUnreadable="The saved key was locked on another PC or Windows account, so it can't be used here. Type it again."
Vertical.KeyClear="Remove the saved key"
Vertical.Help.tiktok="TikTok gives you a server and a stream key when you set up a LIVE from a computer (if your account can). They change every time you go live, so paste both here each time."
Vertical.Help.youtube="The server is filled in. Your stream key is in YouTube Studio → Create → Go live → Stream."
Vertical.Help.instagram="Instagram gives you a server and a stream key in Live Producer on instagram.com. They change every time you go live, so paste both here each time."
Vertical.Help.kick="Your Kick server and stream key are on your Kick dashboard, under Settings → Stream URL & Key."
Vertical.Help.facebook="The server is filled in. Your stream key is in Facebook's Live Producer."
Vertical.Help.x="X gives you a server and a stream key in Media Studio → Producer."
Vertical.Help.twitch="For a second Twitch channel. To show this picture to phone viewers on your own channel, use OBS's Enhanced Broadcasting instead (see the bottom of this window)."
Vertical.Help.other="Paste the RTMP server and stream key the site gives you."

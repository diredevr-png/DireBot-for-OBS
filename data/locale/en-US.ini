FaceAvatar.Name="DireBot Face Avatar"
FaceAvatar.About="Your character, with your real eyes and mouth from your camera (or its own drawn face, moving with yours). Set it up in DireBot: Avatar → Face avatar. It works on your camera's picture here in OBS with Google's MediaPipe face models (Apache 2.0) - nothing is sent anywhere. Or your face can come from an app on your phone (VTube Studio, MeowFace or iFacialMocap) over your own Wi-Fi."
